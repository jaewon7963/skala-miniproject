server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 백엔드가 50MB까지 받는데 nginx 기본값은 1m이라 큰 사업계획서가 413으로 막힌다.
    client_max_body_size 50m;

    # 프런트는 모든 요청을 상대경로 /api 로 보낸다. 여기서 백엔드로 넘겨 주면
    # 브라우저 입장에서는 같은 오리진이라 CORS 프리플라이트 자체가 생기지 않는다.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 업로드와 분석 폴링이 길어질 수 있어 기본 60초보다 넉넉하게 둔다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 라우터가 history 모드라 /library 로 새로고침하면 정적 파일이 없다. index.html 로 되돌린다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
