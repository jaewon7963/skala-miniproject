# 로컬 개발용 기본값. ./gradlew bootRun 이 이 프로파일을 자동으로 켠다(build.gradle 참고).
#
# 컨테이너(java -jar)에는 적용되지 않는다. compose 가 환경변수를 직접 넣고,
# 환경변수가 없으면 application.properties 의 ${DB_PASSWORD} / ${JWT_SECRET} 이
# 그대로 기동을 막는다 — 운영에서 기본 시크릿으로 뜨는 사고를 막기 위해서다.
#
# 개인 시크릿으로 덮어쓰려면 application-local.properties 를 만들고
# SPRING_PROFILES_ACTIVE=dev,local 로 함께 켠다(local 은 .gitignore 대상이다).

# compose 가 PostgreSQL 을 호스트 15432 로 열어 준다(docker compose up -d postgres).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/business}
spring.datasource.password=${DB_PASSWORD:business}

# 시연용 고정값. 32바이트 이상이어야 한다.
jwt.secret=${JWT_SECRET:bizxray-local-demo-signing-key-change-me-0123456789}

# 로컬에서도 데모 계정(kim@company.com)과 검토가 끝난 문서 1건을 심는다. 이미 있으면 건너뛴다.
demo.seed.enabled=${DEMO_SEED_ENABLED:true}
