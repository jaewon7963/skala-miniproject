spring.application.name=bizxray
server.port=8081
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business}
spring.datasource.username=${DB_USERNAME:business}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET}
document.storage.base-dir=${DOCUMENT_STORAGE_DIR:./data/documents}
document.upload.max-size-bytes=52428800

# 분석 파이프라인 — 진행 화면이 단계를 따라갈 수 있도록 구간별 최소 소요 시간을 둔다.
review.parse-duration-ms=4000
review.analyze-duration-ms=4000
# 검토 분석에 쓸 모델. stub은 규칙 기반 목업이다.
review.ai.provider=stub
