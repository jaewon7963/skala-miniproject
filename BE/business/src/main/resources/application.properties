spring.application.name=bizxray
server.port=8081
spring.servlet.main.banner-mode=off
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# --- Analysis/Review 도메인 (DEV3) ---
# docker-compose.yml 의 postgres 기본값과 맞춘다. 실행 전 `docker compose up -d postgres`.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business}
spring.datasource.username=${DB_USERNAME:business}
spring.datasource.password=${DB_PASSWORD:business}

# DEV3 A-6: ddl-auto 는 validate. 임의로 update 로 바꾸지 않는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 명세 1-2: 날짜는 ISO-8601 문자열, 응답은 +09:00 오프셋 포함
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
# ReviewTimes 가 이미 +09:00 으로 변환하므로 Jackson 이 다시 조정하지 않게 한다.
spring.jackson.datatype.datetime.write-dates-with-context-time-zone=false

# --- AI 서버 연동 (DEV3 D-10 §8.10) ---
# API Key 는 코드·설정 파일에 적지 않는다. 환경변수 REVIEW_AI_API_KEY 로만 넣는다.
# 모델명·Temperature 는 코드가 아닌 여기서 바꾼다.
review.ai.enabled=${REVIEW_AI_ENABLED:false}
review.ai.base-url=${REVIEW_AI_BASE_URL:}
review.ai.path=${REVIEW_AI_PATH:/v1/review}
review.ai.api-key=${REVIEW_AI_API_KEY:}
review.ai.model=${REVIEW_AI_MODEL:}
review.ai.temperature=${REVIEW_AI_TEMPERATURE:0.0}
review.ai.prompt-version=${REVIEW_AI_PROMPT_VERSION:review-v1}
review.ai.connect-timeout=5s
review.ai.read-timeout=60s

review.ruleset.fallback-version=ruleset-empty
