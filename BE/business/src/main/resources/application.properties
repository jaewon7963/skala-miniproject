spring.application.name=bizxray
server.port=8081
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business}
spring.datasource.username=${DB_USERNAME:business}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET}
# 브라우저가 5173(FE)에서 8081(BE)을 직접 부를 때만 쓰인다.
# 도커 구성에서는 nginx가 /api를 프록시해 같은 오리진이 되므로 CORS 자체가 발생하지 않는다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
document.storage.base-dir=${DOCUMENT_STORAGE_DIR:./data/documents}
document.upload.max-size-bytes=52428800

# 분석 파이프라인 — 진행 화면이 단계를 따라갈 수 있도록 구간별 최소 소요 시간을 둔다.
review.parse-duration-ms=4000
review.analyze-duration-ms=4000
# 검토 분석에 쓸 모델. stub은 규칙 기반 목업이다.
review.ai.provider=stub

# 시연·평가용 기본 계정과 문서. 도커 구성에서만 켠다(compose가 DEMO_SEED_ENABLED=true 를 넣는다).
# 로컬 bootRun/테스트에는 영향이 없다.
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.email=${DEMO_SEED_EMAIL:kim@company.com}
demo.seed.password=${DEMO_SEED_PASSWORD:logic1234}
