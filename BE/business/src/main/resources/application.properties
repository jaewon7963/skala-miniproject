spring.application.name=bizxray
server.port=8081
spring.main.banner-mode=off
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/business}
spring.datasource.username=${DB_USERNAME:business}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
jwt.secret=${JWT_SECRET}
document.storage.base-dir=${DOCUMENT_STORAGE_DIR:./data/documents}
document.upload.max-size-bytes=52428800
